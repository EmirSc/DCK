<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes DCK — Corsario</title>
<link rel="icon" href="logo_corsario.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --naranja: #FF7F28;   /* Tangelo — primario de marca */
    --naranja2: #FE5000;  /* Orange 021C — acento intenso */
    --azul: #1D4289;      /* secundario de marca */
    --azul-oscuro: #16336B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; font-family: "Atkinson Hyperlegible", sans-serif; }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    height: 64px;
    padding: 0 20px;
    background: linear-gradient(180deg, var(--azul) 0%, var(--azul-oscuro) 100%);
    border-bottom: 4px solid var(--naranja);
    color: #fff;
  }
  header img { height: 44px; }
  .titulo { display: flex; flex-direction: column; line-height: 1.15; }
  .titulo h1 {
    font-family: "Lexend Deca", sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: .02em;
  }
  .titulo span {
    font-size: .78rem;
    color: #B9C6E4;
    text-transform: uppercase;
    letter-spacing: .14em;
  }
  .badge {
    margin-left: auto;
    font-family: "Lexend Deca", sans-serif;
    font-size: .85rem;
    font-weight: 600;
    color: #fff;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px;
    padding: 6px 14px;
    white-space: nowrap;
  }
  .badge b { color: var(--naranja); font-size: 1rem; }
  .btn-catalogo {
    font-family: "Lexend Deca", sans-serif;
    font-size: .85rem;
    font-weight: 600;
    color: #fff;
    text-decoration: none;
    background: var(--naranja);
    border-radius: 6px;
    padding: 9px 16px;
    white-space: nowrap;
    transition: background .15s;
  }
  .btn-catalogo:hover { background: var(--naranja2); }
  .btn-catalogo:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  #mapa-frame { width: 100%; height: calc(100% - 64px); border: none; display: block; }

  @media (max-width: 560px) {
    header { gap: 10px; padding: 0 12px; }
    header img { height: 34px; }
    .titulo span, .badge { display: none; }
  }
</style>
</head>
<body>
  <header>
    <img src="logo_corsario.png" alt="Corsario">
    <div class="titulo">
      <h1>Mapa de Clientes DCK</h1>
      <span>Distribución Nicaragua</span>
    </div>
    <div class="badge"><b>283</b> clientes ubicados</div>
    <a class="btn-catalogo" href="https://corsariosa.net/catalogocorsario">Ver catálogo</a>
  </header>
  <iframe id="mapa-frame" src="mapa_ubicaciones_dck.html" title="Mapa de ubicaciones de clientes DCK">
    <p>Tu navegador no soporta iframes. Abre <a href="mapa_ubicaciones_dck.html">mapa_ubicaciones_dck.html</a> directamente.</p>
  </iframe>
</body>
</html>
